name: Deploy Matken Electrical preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --reporter=dot
      - name: Verify evidence and provider gates
        run: npm run verify
      - name: Build GitHub Pages artifact
        env:
          GITHUB_PAGES_BASE: /matken-electrical-preview/
          VITE_GITHUB_PAGES: "true"
        run: npm run build
      - name: Confirm Pages artifact
        run: |
          test -f dist/client/index.html
          test -f dist/client/404.html
          test -f dist/client/.nojekyll
          grep -q '/matken-electrical-preview/assets/' dist/client/index.html
          grep -q '"start_url": "/matken-electrical-preview/#/"' dist/client/site.webmanifest
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/client
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
